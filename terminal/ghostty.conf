# Noir Velocity for Ghostty. Installed by scripts/install-ghostty.py to ~/.config/ghostty/config.
# Colors between the palette markers are generated by scripts/apply-palette.py.

font-family = SF Mono
font-family = Menlo
font-size = 12
adjust-cell-height = 5%

# Ghostty shows PNG/JPEG backgrounds only, so this is the wallpaper's first frame.
background-image = ~/.config/ghostty/noir-velocity.png
background-image-fit = cover
background-image-opacity = 0.75

cursor-style = bar
cursor-style-blink = true
mouse-hide-while-typing = true
window-padding-x = 10
window-padding-y = 6
macos-titlebar-style = tabs
confirm-close-surface = false
quit-after-last-window-closed = false

# palette-begin
background = #141320
foreground = #ECEAF5
cursor-color = #FFE68F
cursor-text = #141320
selection-background = #4A3D78
selection-foreground = #FFFFFF
palette = 0=#2B2840
palette = 1=#FF5C8A
palette = 2=#5CE0A5
palette = 3=#FFD75C
palette = 4=#6E8DFF
palette = 5=#C46BFF
palette = 6=#4FDDFF
palette = 7=#ECEAF5
palette = 8=#7E7A9C
palette = 9=#FF8FB1
palette = 10=#8DF1C6
palette = 11=#FFE68F
palette = 12=#96AEFF
palette = 13=#D89DFF
palette = 14=#8DECFF
palette = 15=#FFFFFF
# palette-end
