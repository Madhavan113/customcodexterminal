# tmux options for the claude-noir layout only; loaded with its own server socket so your
# regular tmux configuration is untouched.
set -g status off
set -g mouse on
set -g escape-time 0
set -g focus-events on
set -g history-limit 50000
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
# Wrap each redraw in synchronized-update marks so the outer terminal paints whole frames
# instead of partial ones. tmux's built-in table leaves this off for WezTerm; terminals
# without the mode ignore the marks.
set -as terminal-features ",*:sync"
set -g allow-passthrough on
set -g pane-border-style "fg=colour60"
set -g pane-active-border-style "fg=colour60"
set -g pane-border-lines single
set -g remain-on-exit off
set -g set-titles on
set -g set-titles-string "claude"
# Show the ordinary text caret in Claude Code: a blinking bar, and let the app change it.
set -g cursor-style blinking-bar
set -ga terminal-overrides ",*:Ss=\\E[%p1%d q:Se=\\E[ q"
